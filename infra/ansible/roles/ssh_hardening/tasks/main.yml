---
# Lock-out protection: never disable password login unless a key is already installed
# for every account that is allowed to log in.
- name: Look up the account database
  ansible.builtin.getent:
    database: passwd

- name: Check that an authorized_keys file with content exists for each allowed user
  ansible.builtin.stat:
    path: "{{ getent_passwd[item][4] }}/.ssh/authorized_keys"
  register: ssh_hardening_keys
  loop: "{{ ssh_allow_users }}"

- name: Refuse to continue without a working key
  ansible.builtin.assert:
    that: item.stat.exists and item.stat.size > 0
    fail_msg: >-
      {{ item.item }} has no authorized_keys content on {{ inventory_hostname }}.
      Disabling password authentication would lock you out. Aborting.
    quiet: true
  loop: "{{ ssh_hardening_keys.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Install the SSH daemon drop-in (validated with sshd -t before it is installed)
  ansible.builtin.template:
    src: 00-lab-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-lab-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd

- name: Install the fail2ban jail
  ansible.builtin.template:
    src: jail-lab-sshd.local.j2
    dest: /etc/fail2ban/jail.d/10-lab-sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban.service
    enabled: true
    state: started

- name: Apply daemon changes before verifying
  ansible.builtin.meta: flush_handlers

- name: Read the effective sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -T
  register: ssh_hardening_effective
  changed_when: false

# sshd -T prints keys in lower case on older OpenSSH and in CamelCase on newer releases.
- name: Verify the effective configuration (catches an earlier drop-in overriding ours)
  ansible.builtin.assert:
    that:
      - "'permitrootlogin no' in (ssh_hardening_effective.stdout_lines | map('lower') | list)"
      - "'passwordauthentication no' in (ssh_hardening_effective.stdout_lines | map('lower') | list)"
      - "'kbdinteractiveauthentication no' in (ssh_hardening_effective.stdout_lines | map('lower') | list)"
      - "'pubkeyauthentication yes' in (ssh_hardening_effective.stdout_lines | map('lower') | list)"
      - "'permitemptypasswords no' in (ssh_hardening_effective.stdout_lines | map('lower') | list)"
      - "'authenticationmethods publickey' in (ssh_hardening_effective.stdout_lines | map('lower') | list)"
    fail_msg: Effective sshd configuration does not match the policy; check other files in /etc/ssh/sshd_config.d.
    quiet: true
