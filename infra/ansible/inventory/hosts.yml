---
# Management addresses come from infra/libvirt/networks/lab-mgmt.xml.
# Interface names assume virtio NICs on a q35 guest in the order created by lab.sh:
# enp1s0 = management, enp2s0.. = lab segments. The `network` role fails early if a
# listed interface does not exist, so a different naming scheme is detected, not guessed.
all:
  vars:
    ansible_user: debian
    ansible_python_interpreter: /usr/bin/python3
    lab_mgmt_if: enp1s0
  children:
    routers:
      hosts:
        lab-edge:
          ansible_host: 192.168.150.11
          lab_forwarding: true
          lab_interfaces:
            - name: enp2s0   # LAN
              role: lan
              address: 192.168.10.1
              prefix: 24
            - name: enp3s0   # DMZ
              role: dmz
              address: 192.168.20.1
              prefix: 24
            - name: enp4s0   # WAN (documentation-only TEST-NET addresses)
              role: wan
              address: 198.51.100.1
              prefix: 30
              gateway: 198.51.100.2
              extra_addresses:
                - 198.51.100.10/30
        lab-isp-router:
          ansible_host: 192.168.150.12
          lab_forwarding: true
          lab_interfaces:
            - name: enp2s0   # WAN
              role: wan
              address: 198.51.100.2
              prefix: 30
              routes:
                - {to: 198.51.100.8/30, via: 198.51.100.1}
                - {to: 192.168.20.0/24, via: 198.51.100.1}
            - name: enp3s0   # ISP segment
              role: isp
              address: 10.10.10.1
              prefix: 24
    clients:
      hosts:
        lab-lan-a:
          ansible_host: 192.168.150.21
          lab_interfaces:
            - {name: enp2s0, address: 192.168.10.10, prefix: 24, gateway: 192.168.10.1}
        lab-lan-b:
          ansible_host: 192.168.150.22
          lab_interfaces:
            - {name: enp2s0, address: 192.168.10.11, prefix: 24, gateway: 192.168.10.1}
    web:
      hosts:
        lab-dmz-web:
          ansible_host: 192.168.150.31
          lab_interfaces:
            - {name: enp2s0, address: 192.168.20.10, prefix: 24, gateway: 192.168.20.1}
        lab-isp-client:
          ansible_host: 192.168.150.41
          lab_interfaces:
            - {name: enp2s0, address: 10.10.10.10, prefix: 24, gateway: 10.10.10.1}
    edge:
      hosts:
        lab-edge:
